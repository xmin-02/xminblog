name = "blog-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.xmin.blog/*"
zone_name = "xmin.blog"

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN   — GitHub Personal Access Token with repo write access
#   ADMIN_PASSWORD — Plain-text admin password (worker hashes and compares)
#   JWT_SECRET     — Random secret for signing JWTs (e.g. openssl rand -hex 32)
#   APNS_KEY_ID    — Apple Push Notifications auth key ID
#   APNS_TEAM_ID   — Apple Developer team ID
#   APNS_PRIVATE_KEY — Apple .p8 private key, with newlines preserved or escaped as \n
# Vars:
#   APNS_TOPIC     — iOS app bundle identifier, e.g. sh.xmin.blogadmin

[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "010aa8d9-5bd9-488a-870c-6d9dd1e4c488"
