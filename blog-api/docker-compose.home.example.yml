services:
  blog-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.home
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_DRIVER: postgres
      CONTENT_BACKEND: db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    ports:
      - "0.0.0.0:3001:3000"
